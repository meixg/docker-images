# Temporary vulnerability waivers belong under `vulnerabilities` with an
# explicit statement.
# Example:
# vulnerabilities:
#   - id: CVE-2024-12345
#     statement: "Pending upstream fix; tracked in meixg/docker-images#123"
vulnerabilities:
  - id: CVE-2026-56864
    statement: >-
      GitHub CLI v2.100.0 is the latest official release. Trivy detects the
      indirectly embedded golang.org/x/mod v0.39.0 in the prebuilt gh binary;
      the affected module-proxy/checksum verification path is not used by gh.
      Remove this waiver when an official gh release includes x/mod v0.40.0 or
      later.
  - id: CVE-2026-56865
    statement: >-
      GitHub CLI v2.100.0 is the latest official release. Trivy detects the
      indirectly embedded golang.org/x/mod v0.39.0 in the prebuilt gh binary;
      the affected module-proxy/checksum verification path is not used by gh.
      Remove this waiver when an official gh release includes x/mod v0.40.0 or
      later.
  - id: CVE-2026-56854
    purls:
      - pkg:golang/golang.org/x/crypto
    expired_at: "2026-12-31T23:59:59Z"
    statement: >-
      Trivy detects the module in the official cloudflared binary. cloudflared
      uses golang.org/x/crypto/ssh only to encode an Access SSH public key and
      does not call ssh.NewServerConn or implement an SSH server. This CVE
      affects source-address enforcement in SSH server authentication callbacks.
      Revisit when Cloudflare publishes a build using x/crypto v0.55.0 or later.
  - id: CVE-2026-84304
    purls:
      - pkg:golang/google.golang.org/grpc
    expired_at: "2026-12-31T23:59:59Z"
    statement: >-
      Trivy detects the module in the official cloudflared binary. cloudflared
      uses gRPC through the OpenTelemetry client exporter and does not expose a
      gRPC server. This CVE affects unauthenticated gRPC server HTTP/2 stream
      handling. Revisit when Cloudflare publishes a build using grpc v1.83.1 or
      later.
  - id: CVE-2026-84445
    purls:
      - pkg:golang/google.golang.org/grpc
    expired_at: "2026-12-31T23:59:59Z"
    statement: >-
      Trivy detects the module in the official cloudflared binary. cloudflared
      does not configure or expose a gRPC xDS server, which is the affected code
      path for this CVE. Revisit when Cloudflare publishes a build using a fixed
      grpc release.
  # npm vendors its HTTP client inside the published tarball, so the npm copy in
  # /usr/local/lib/node_modules/npm cannot be upgraded independently of npm
  # itself. npm 12.2.1 (latest) still bundles undici 6.29.0; these three CVEs are
  # fixed in undici 6.29.1. The image only uses npm interactively against
  # trusted registries over TLS, and the tools under /usr/local/lib/node_modules
  # (pi, codex, opencode) ship their own patched undici.
  - id: CVE-2026-109383
    purls:
      - pkg:npm/undici
    paths:
      - "usr/local/lib/node_modules/npm/node_modules/undici/package.json"
    expired_at: "2027-02-01T00:00:00Z"
    statement: >-
      npm 12.2.1 (latest) vendors undici 6.29.0; no released npm bundle ships
      undici 6.29.1 yet. Revisit for the next npm release.
  - id: CVE-2026-109869
    purls:
      - pkg:npm/undici
    paths:
      - "usr/local/lib/node_modules/npm/node_modules/undici/package.json"
    expired_at: "2027-02-01T00:00:00Z"
    statement: >-
      npm 12.2.1 (latest) vendors undici 6.29.0; no released npm bundle ships
      undici 6.29.1 yet. Revisit for the next npm release.
  - id: CVE-2026-87018
    purls:
      - pkg:npm/undici
    paths:
      - "usr/local/lib/node_modules/npm/node_modules/undici/package.json"
    expired_at: "2027-02-01T00:00:00Z"
    statement: >-
      npm 12.2.1 (latest) vendors undici 6.29.0; no released npm bundle ships
      undici 6.29.1 yet. Revisit for the next npm release.
