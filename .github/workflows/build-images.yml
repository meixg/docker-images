name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'dev-base/**'
      - '**/Dockerfile'
      - '.github/workflows/build-images.yml'
  schedule:
    # Weekly clean rebuild every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: 'Force a clean rebuild (re-pull pinned base image digest and ignore build cache)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  CLEAN_REBUILD: ${{ github.event_name == 'schedule' || github.event.inputs.clean_rebuild == 'true' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [dev-base]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: ${{ env.CLEAN_REBUILD == 'true' }}
          no-cache: ${{ env.CLEAN_REBUILD == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
