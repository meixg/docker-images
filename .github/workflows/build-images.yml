name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'dev-base/**'
      - '**/Dockerfile'
      - '.trivyignore.yaml'
      - '.github/workflows/build-images.yml'
  schedule:
    # Weekly clean rebuild every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: 'Force a clean rebuild (pull latest base image and ignore build cache)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  CLEAN_REBUILD: ${{ github.event_name == 'schedule' || github.event.inputs.clean_rebuild == 'true' }}

jobs:
  verify-dev-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build smoke-test image
        run: |
          set -euo pipefail
          build_args=()
          if [ "${CLEAN_REBUILD}" = "true" ]; then
            build_args+=(--pull --no-cache)
          fi
          docker build "${build_args[@]}" \
            -t dev-base-smoke:${{ github.sha }} \
            ./dev-base

      - name: Run dev-base smoke test
        run: ./dev-base/smoke-test.sh dev-base-smoke:${{ github.sha }}

      - name: Scan dev-base for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: dev-base-smoke:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

  build-and-push:
    needs: verify-dev-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        image: [dev-base]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: ${{ env.CLEAN_REBUILD == 'true' }}
          no-cache: ${{ env.CLEAN_REBUILD == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
