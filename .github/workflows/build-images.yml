name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'dev-base/**'
      - '**/Dockerfile'
      - '.trivyignore.yaml'
      - '.github/workflows/build-images.yml'
  schedule:
    # Weekly clean rebuild every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: 'Force a clean rebuild (re-pull pinned base image digest and ignore build cache)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  CLEAN_REBUILD: ${{ toJSON(github.event_name == 'schedule' || github.event.inputs.clean_rebuild == 'true' || github.event.inputs.clean_rebuild == true) }}

jobs:
  verify-dev-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build smoke-test image
        run: |
          set -euo pipefail
          build_args=()
          if [ "${CLEAN_REBUILD}" = "true" ]; then
            build_args+=(--pull --no-cache)
          fi
          docker build "${build_args[@]}" \
            -t dev-base-smoke:${{ github.sha }} \
            ./dev-base

      - name: Run dev-base smoke test
        run: ./dev-base/smoke-test.sh dev-base-smoke:${{ github.sha }}

      - name: Scan dev-base for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: image
          image-ref: dev-base-smoke:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: os,library
          severity: HIGH,CRITICAL

  build-and-push:
    needs: verify-dev-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        image: [dev-base]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: ${{ fromJSON(env.CLEAN_REBUILD) }}
          no-cache: ${{ fromJSON(env.CLEAN_REBUILD) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-dev-paseo:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/dev-paseo
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./dev-paseo
          platforms: linux/amd64,linux/arm64
          push: true
          pull: ${{ fromJSON(env.CLEAN_REBUILD) }}
          no-cache: ${{ fromJSON(env.CLEAN_REBUILD) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/dev-paseo
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
